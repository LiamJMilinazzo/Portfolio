document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

═══════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: ffset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1p u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 34px;\">\n        <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <article class=\"blueprint\" style=\"display: flex; flex-direction: column; cursor: pointer; background: transparent;\" sc-camel-on-click=\"{{ p.open }}\" role=\"button\" sc-camel-tab-index=\"0\" sc-camel-on-key-down=\"{{ p.key }}\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 1px solid var(--color-divider);\">\n              <img src=\"{{ p.thumb }}\" alt=\"{{ p.alt }}\" style=\"display: block; width: 100%; height: 100%; object-fit: cover;\">\n            <\u002Fdiv>\n            <div style=\"padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 12px; flex: 1;\">\n              <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n                <span style=\"font-family: var(--font-heading); font-size: 13px; letter-spacing: 0.14em; color: var(--color-neutral-600);\">{{ p.num }}<\u002Fspan>\n                <span style=\"font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700);\">{{ p.genre }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 30px; line-height: 1.02; text-transform: uppercase; margin: 0;\">{{ p.title }}<\u002Fh3>\n              <p style=\"font-size: 14.5px; line-height: 1.6; color: var(--color-neutral-800); margin: 0; flex: 1; text-wrap: pretty;\">{{ p.logline }}<\u002Fp>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n                <sc-for list=\"{{ p.tags }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <span class=\"tag tag-outline\">{{ t.labe ar(--color-neutral-600);\">{{ u.num }} · In progress<\u002Fspan>\n                <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 28px; line-height: 1.02; text-transform: uppercase; margin: 0; color: var(--color-neutral-700);\">{{ u.title }}<\u002Fh3>\n                <p style=\"font-size: 14px; line-height: 1.6; color: var(--color-neutral-700); margin: 0; flex: 1;\">{{ u.note }}<\u002Fp>\n                <span class=\"tag tag-neutral\" style=\"align-self: flex-start;\">Target · Nov 1, 2026<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"about\" style=\"padding: 22px 0 70px; border-top: 1px solid var(--color-divider);\">\n      <div style=\"padding: 34px 0;\">\n        <div style=\"font-family: var(--font-heading); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">Sheet 03 · Profile<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(30px, 4vw, 48px); line-height: 1.02; text-transform: uppercase; margin: 0;\">How I work<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 34px; align-items: start;\">\n        <div class=\"blueprint\" style=\"padding: 26px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--color-divider);\">Approach<\u002Fh3>\n          <p style=\"font-size: 15px; line-height: 1.72; color: var(--color-neutral-800); margin: 0 0 14px;\">I like starting messy: pitch the silly idea, get it playable, then keep tuning until it actually feels good in someone's hands. Jams are my favorite version of that, because a loop cannot argue with you. It either works or it doesn't, and you find out in about ten seconds.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.72; color: var(--color-neutral-800); margin: 0 0 14px;\">I care about the whole picture: theme, mechanics, and the moment a player clicks with what you built. I am comfortable on the art side and just as happy deep in systems logic, so I can hand a team a finished vertical slice rather than a spec.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.72; color: var(--color-neutral-800); margin: 0;\">Outside of games I coach students on career readiness at NAU, mentor 6–12th grade teachers building computer science curriculum, and evaluate AI-generated media for logical failures. All three keep me writing clearly and testing assumptions.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"blueprint\" style=\"padding: 26px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--color-divider);\">Toolkit<\u002Fh3>\n          <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n            <div>\n              <div style=\"font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 8px;\">Design &amp; engines<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n                <span class=\"tag tag-accent\">Game design<\u002Fspan><span class=\"tag tag-accent\">Gameplay systems<\u002Fspan><span class=\"tag tag-accent\">Level design<\u002Fspan><span class=\"tag tag-accent\">Rapid prototyping<\u002Fspan><span class=\"tag tag-accent\">Playtesting<\u002Fspan><span class=\"tag tag-accent\">Unreal Engine<\u002Fspan><span class=\"tag tag-accent\">Construct 3<\u002Fspan><span class=\"tag tag-accent\">Twine<\u002Fspan><span class=\"tag tag-accent\">Ink<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 8px;\">Programming<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n                <span class=\"tag tag-neutral\">C#<\u002Fspan><span class=\"tag tag-neutral\">C<\u002Fspan><span class=\"tag tag-neutral\">Python<\u002Fspan><span class=\"tag tag-neutral\">Java<\u002Fspan><span class=\"tag tag-neutral\">JavaScript<\u002Fspan><span class=\"tag tag-neutral\">HTML<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 8px;\">Art, 3D &amp; media<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n                <span class=\"tag tag-neutral\">Blender<\u002Fspan><span class=\"tag tag-neutral\">3D modeling<\u002Fspan><span class=\"tag tag-neutral\">3D fabrication<\u002Fspan><span class=\"tag tag-neutral\">Photoshop<\u002Fspan><span class=\"tag tag-neutral\">Illustrator<\u002Fspan><span class=\"tag tag-neutral\">Premiere Pro<\u002Fspan><span class=\"tag tag-neutral\">After Effects<\u002Fspan><span class=\"tag tag-neutral\">Tinkercad<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 8px;\">Production<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n lign-items: end; padding: 34px 0;\">\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">Sheet 04 · Record<\u002Fdiv>\n          <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(30px, 4vw, 48px); line-height: 1.02; text-transform: uppercase; margin: 0;\">Experience<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size: 15px; line-height: 1.65; color: var(--color-neutral-800); margin: 0; text-wrap: pretty;\">Teaching, evaluating, and shipping. Every one of these roles is about making something complicated legible to someone else.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid var(--color-divider);\">\n        <div style=\"display: grid; grid-template-columns: minmax(110px, 0.75fr) minmax(0, 3fr); gap: 28px; padding: 24px 0; border-bottom: 1px solid var(--color-divider);\">\n          <div style=\"font-family: var(--font-heading); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-600);\">May 2026<br>— Present<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; text-transform: uppercase; margin: 0 0 3px;\">Let's Talk Code Mentor<\u002Fh3>\n            <div style=\"font-size: 13.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">LTC · NAU Grant · Hybrid<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.7; color: var(--color-neutral-800); margin: 0;\">Partner with 6–12th grade teachers nationwide to build computer science curriculum that gets students engaged with technology, now reaching 35 classrooms across 4 states. I train teachers on new instructional platforms, travel to partner schools for on-site rollout support, and synthesize conference feedback into the next curriculum revision.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(110px, 0.75fr) minmax(0, 3fr); gap: 28px; padding: 24px 0; border-bottom: 1px solid var(--color-divider);\">\n          <div style=\"font-family: var(--font-heading); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-600);\">Jan 2026<br>— Present<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; text-transform: uppercase; margin: 0 0 3px;\">AI Media Evaluator<\u002Fh3>\n            <div style=\"font-size: 13.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">Handshake · Remote<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.7; color: var(--color-neutral-800); margin: 0;\">Assess AI-generated media for logical flaws, inconsistencies, and system failures, then document recurring issues with structured methods. Findings go back to cross-functional teams and guide debugging priorities, model accuracy work, and content-quality standards.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(110px, 0.75fr) minmax(0, 3fr); gap: 28px; padding: 24px 0; border-bottom: 1px solid var(--color-divider);\">\n          <div style=\"font-family: var(--font-heading); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-600);\">Aug 2025<br>— Present<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; text-transform: uppercase; margin: 0 0 3px;\">Career Development Student Assistant<\u002Fh3>\n            <div style=\"font-size: 13.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">Northern Arizona University · Flagstaff, AZ<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.7; color: var(--color-neutral-800); margin: 0;\">Led planning for two university-wide career fairs, coordinating sponsors and logistics for 136 student participants, and delivered over 100 one-on-one coaching sessions. Built the outreach side too: social campaigns and monthly newsletters that lifted engagement 94.1%.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(110px, 0.75fr) minmax(0, 3fr); gap: 28px; padding: 24px 0; border-bottom: 1px solid var(--color-divider);\">\n          <div style=\"font-family: var(--font-heading); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-600);\">Aug 2023<br>— May 2024<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; text-transform: uppercase; margin: 0 0 3px;\">Film &amp; Photography Instructor / TA<\u002Fh3>\n            <div style=\"font-size: 13.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">Teaching assistant &amp; class instructor<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.7; color: var(--color-neutral-800); margin: 0;\">Ran hands-on sessions for 30+ students in DSLR photography, Photoshop, Lightroom, and visual storytelling. Mentored creative projects with individual critique; several student works were selected for campus exhibitions.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(110px, 0.75fr) minmax(0, 3fr); gap: 28px; padding: 24px 0; border-bottom: 1px solid var(--color-divider);\">\n          <div style=\"font-family: var(--font-heading); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-600);\">June 2023<br>— July 2024<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; text-transform: uppercase; margin: 0 0 3px;\">Shift Lead<\u002Fh3>\n            <div style=\"font-size: 13.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">Jersey Mike's · Scottsdale, AZ<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.7; color: var(--color-neutral-800); margin: 0;\">Supervised a 15-member team through peak operations, including the store's busiest day at $22K in sales. Ran opening and closing four-plus times a week, owned cash handling and register reconciliation, and managed inventory shipments to keep discrepancies down and food costs inside target margins. Where I learned to hold a standard under real pressure.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"education\" style=\"padding: 22px 0 70px; border-top: 1px solid var(--color-divider);\">\n      <div style=\"padding: 34px 0;\">\n        <div style=\"font-family: var(--font-heading); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">Sheet 05 · Education<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(30px, 4vw, 48px); line-height: 1.02; text-transform: uppercase; margin: 0;\">Study &amp; abroad<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 34px; align-items: start;\">\n        <div class=\"blueprint\" style=\"padding: 26px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 10px;\">Expected May 2028<\u002Fdiv>\n          <h3 style=\"font-family ing: 0.1em; text-transform: uppercase; margin: 0 0 14px; color: var(--color-accent-700);\">What I owned<\u002Fh3>\n            <ul style=\"margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px;\">\n              <sc-for list=\"{{ active.owned }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <li style=\"font-size: 15px; line-height: 1.6; color: var(--color-neutral-800);\">{{ o.text }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ active.hasStills }}\" hint-placeholder-val=\"{{ false }}\">\n            <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 19px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 18px;\">Stills<\u002Fh3>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px;\">\n              <sc-for list=\"{{ active.stills }}\" as=\"st\" hint-placeholder-count=\"3\">\n                <figure class=\"blueprint\" style=\"margin: 0; padding: 0;\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <img src=\"{{ st.file }}\" alt=\"{{ st.caption }}\" style=\"display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-bottom: 1px solid var(--color-divider);\">\n                  <figcaption style=\"font-size: 13px; line-height: 1.5; color: var(--color-neutral-700); padding: 10px 12px;\">{{ st.caption }}<\u002Ffigcaption>\n                <\u002Ffigure>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; border-top: 1px solid var(--color-divider); padding-top: 24px;\">\n            <sc-if value=\"{{ active.hasPlay }}\" hint-placeholder-val=\"{{ false }}\">\n              <a class=\"btn btn-primary\" href=\"{{ active.playUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-family: var(--font-heading); letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 20px; text-decoration: none;\">Play the build<\u002Fa>\n            <\u002Fsc-if>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ next }}\" style=\"font-family: var(--font-heading); letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 20px;\">Next project →<\u002Fbutton>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ close }}\" style=\"font-family: var(--font-heading); letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 12px;\">Close<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showUpcoming&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;resumeUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;resume/Liam-Milinazzo-Resume.pdf&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;availability&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Looking for a Summer 2027 game design or production internship, and open to any studio role where I can design systems and build them. Based in Flagstaff, Arizona, happy to relocate or work remote.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: null };\n\n  componentDidMount() {\n    this._onKey = (e) => {\n      if (e.key === 'Escape' && this.state.open !== null) this.setState({ open: null });\n    };\n    window.addEventListener('keydown', this._onKey);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this._onKey);\n    document.body.style.overflow = '';\n  }\n  componentDidUpdate() {\n    document.body.style.overflow = this.state.open !== null ? 'hidden' : '';\n  }\n\n  data() {\n    return [\n      {\n        num: '01',\n        title: 'Nara Order',\n        genre: 'Tycoon / Time management',\n        role: 'Lead developer',\n        thumb: 'images/nara-order.jpg',\n        alt: 'Nara Order gameplay',\n        playUrl: '',\n        hasPlay: false,\n        logline: 'A single-player food-stand tycoon set in Nara Park, just outside Todai-ji. Read the ticket, build the order, and keep up with a rotating cast of customers: children, deer nudging you for biscuits, and Buddha asking for blessed water from the temple cleansing basin.',\n        tags: [{ label: 'Construct 3' }, { label: 'Single player' }, { label: 'Published' }, { label: 'Solo code' }],\n        specs: [\n          { k: 'My role', v: 'Lead developer' },\n          { k: 'Team', v: 'Class team of 3' },\n          { k: 'Setting', v: 'Nara, Japan' },\n          { k: 'Status', v: 'Playable build on request' }\n        ],\n        story: [\n          { head: 'The idea', text: 'Everything in the game traces back to something we actually saw in Nara: the archway before Todai-ji, the deer wandering loose through the park, the shika senbei sold from carts along the path. Instead of writing an essay about the trip, I turned the day into a shift you have to survive.' },\n          { head: 'The loop', text: 'The loop stays deliberately narrow: read the ticket, assemble the order fast, do not let the timer run out. Difficulty comes from customer variety and pacing rather than added mechanics, so a new player understands the whole game in about fifteen seconds and still gets squeezed by minute three.' },\n          { head: 'The look', text: 'Calm, semi-realistic anime rendering pulled from Buddhist temple aesthetics and Nintendo\\u2019s welcoming design philosophy. Warm daylight, readable silhouettes, no visual noise competing with the order ticket, which is the one thing the player must never lose track of.' }\n        ],\n        owned: [\n          { text: 'Wrote the full codebase, front to back.' },\n          { text: 'Built every backend system: customer logic, scoring, lives, and pacing.' },\n          { text: 'Designed the complete interaction flow from order intake to serve.' },\n          { text: 'Integrated all art and UI assets into gameplay for the final build.' }\n        ]\n      },\n      {\n        num: '02',\n        title: 'Sugar Scape',\n        genre: 'Survival / Arcade',\n        role: 'Lead developer',\n        thumb: 'images/sugar-scape.jpg',\n        alt: 'Sugar Scape gameplay',\n        playUrl: '',\n        hasPlay: false,\n        logline: 'A survival arcade maze game built in Japan with an international team. Move through a colorful maze eating cute creatures to rack up score, except the more you eat, the more enemies spawn. Before long, staying alive is the whole game.',\n        tags: [{ label: '48-hour jam' }, { label: '1st place' }, { label: 'Published' }, { label: 'Arrow keys + space' }],\n        specs: [\n          { k: 'My role', v: 'Lead developer' },\n          { k: 'Team', v: 'International, 48 hours' },\n          { k: 'Result', v: '1st place, consecutive' },\n          { k: 'Status', v: 'Playable build on request' }\n        ],\n        story: [\n          { head: 'The constraint', text: 'Forty-eight hours, a team I met that day, and no shared design vocabulary yet. We picked an absurd premise on purpose because it made every decision fast: if a feature did not make the maze funnier or tenser, it did not get built.' },\n          { head: 'The loop', text: 'Roam, stay mobile, eat the animals when they come into range. Enemy count scales with your score, so a score chase quietly converts into a test of movement and timing. The difficulty curve is the scoring system, which meant one tuning pass affected both at once.' },\n          { head: 'What it taught me', text: 'Comparing Eastern and Western design philosophies in class that same month showed up directly in our choices: readable silhouettes, immediate feedback, no tutorial. It won consecutive first-place finishes, and the reason was legibility, not scope.' }\n        ],\n        owned: [\n          { text: 'Designed the maze layout and pacing of enemy spawns.' },\n          { text: 'Coded player and enemy movement, plus time-based interactions.' },\n          { text: 'Tuned the difficulty scaling that ties enemy count to score.' },\n          { text: 'Drew the baby (player character) and the panda (main enemy).' }\n        ]\n      },\n      {\n        num: '03',\n        title: 'Meltdown',\n        genre: 'First-person / Exploration',\n        role: 'In progress',\n        thumb: 'images/meltdown/thumb.png',\n        alt: 'Meltdown title screen',\n        playUrl: '',\n        hasPlay: false,\n        logline: 'Restore the power. Try to find the way out. A first-person escape through the failing facility. Use your environment to figure out what happened, working by flashlight through dark corridors and valve-locked rooms.',\n        tags: [{ label: 'In progress' }, { label: 'First-person' }, { label: 'Single player' }],\n        specs: [\n          { k: 'Perspective', v: 'First-person' },\n          { k: 'Controls', v: 'WASD, mouse, E, F' },\n          { k: 'Core verbs', v: 'Explore, light, restore' },\n          { k: 'Status', v: 'In progress' }\n        ],\n        story: [\n          { head: 'The idea', text: 'The power is out and you are inside. Nobody explains what went wrong; the facility itself does. The rooms, the machinery and what was left behind tell the story to anyone who looks closely.' },\n          { head: 'The loop', text: 'Push into the dark with a flashlight, find the valves and systems that bring the power back, and hold E to work them. Each restored system opens more of the facility and moves you closer to the exit.' },\n          { head: 'The look', text: 'Almost everything is darkness. The flashlight beam is the only reliable light, so the player decides what to see, and the warm glow of the core is the one landmark that reads from across the room.' }\n        ],\n        owned: [],\n        stills: [\n          { file: 'images/meltdown/still-01.png', caption: 'The first corridor, lit only by the flashlight.' },\n          { file: 'images/meltdown/still-02.png', caption: 'Pipework and a valve in the beam, the first thing to restore.' },\n          { file: 'images/meltdown/still-03.png', caption: 'The core, glowing through the dark.' }\n        ]\n      }\n    ];\n  }\n\n  renderVals() {\n    const projects = this.data().map((p, i) => ({\n      ...p,\n      hasStills: !!(p.stills && p.stills.length),\n      hasOwned: !!(p.owned && p.owned.length),\n      open: () => this.setState({ open: i }),\n      key: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.setState({ open: i }); } }\n    }));\n    const i = this.state.open;\n    const active = i !== null ? projects[i] : null;\n    return {\n      projects,\n      active: active || {},\n      hasActive: !!active,\n      close: () => this.setState({ open: null }),\n      backdrop: () => this.setState({ open: null }),\n      stop: (e) => e.stopPropagation(),\n      next: () => this.setState((s) => ({ open: (s.open + 1) % projects.length })),\n      resumeUrl: this.props.resumeUrl ?? 'resume/Liam-Milinazzo-Resume.pdf',\n      availability: this.props.availability ?? 'Looking for a Summer 2027 game design or production internship, and open to any studio role where I can design systems and build them. Based in Flagstaff, Arizona, happy to relocate or work remote.',\n      showUpcoming: this.props.showUpcoming ?? true,\n      upcoming: [\n        { num: '04', slot: 'Thumbnail 16:10', title: 'Project slot open', note: 'Reserved slot for a current project.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
